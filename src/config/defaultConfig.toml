# ── Agent settings (ARCHITECT_DECISIONS §3–7) ───────────────────────────
[agent]
auto_spawn_daemon = true
mcp_auto_register = false
default_scope     = "read-only"
require_confirm   = false
audit_log_path    = "~/.config/lazyhub/audit.log"

[daemon]
idle_timeout_minutes = 30
socket_path          = "~/.config/lazyhub/daemon.sock"
pid_file             = "~/.config/lazyhub/daemon.pid"

# ── Built-in permission scopes (ARCHITECT_DECISIONS §7) ─────────────────
# Override or extend by adding your own [scopes.<name>] blocks in your config.
[scopes.full]
allow_reads     = true
allow_writes    = true
allow_approvals = true
allow_merges    = true
allow_comments  = true

[scopes.read-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = false

[scopes.review-only]
allow_reads     = true
allow_writes    = false
allow_approvals = true
allow_merges    = false
allow_comments  = true

[scopes.comment-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = true

[scopes.no-merge]
allow_reads     = true
allow_writes    = true
allow_approvals = true
allow_merges    = false
allow_comments  = true

[scopes.triage-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = true


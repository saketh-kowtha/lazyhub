# lazyhub default configuration — shipped with the package.
#
# Copy any section into ~/.config/lazyhub/lazyhub.toml to override it.
# User values are merged on top of these defaults (per-key); anything you omit
# keeps the default below. See `docs/` for the full schema reference.
#
# NOTE: the values here MUST stay in sync with DEFAULT_CONFIG in schema.js
# (a unit test asserts they parse to the same object).

# Custom tabs (Phase E4 #66). These bare top-level tables MUST stay above the
# first [section] header — TOML assigns trailing bare keys to the last opened
# table otherwise.
[[tabs]]
id    = "focus"
label = "Focus"
order = 0
key   = "<space>0"
panes = [
  { kind = "prs",    filter = { reviewer = "@me", state = "open" }, title = "Review requested", limit = 25 },
  { kind = "prs",    filter = { author = "@me", state = "open" }, title = "My open PRs", limit = 25 },
  { kind = "issues", filter = { assignee = "@me", state = "open" }, title = "Assigned issues", limit = 25 },
]

# ── Meta ─────────────────────────────────────────────────────────────────
[meta]
schema_version = "1.0"   # bumped on breaking schema changes
config_url     = ""      # optional HTTPS URL; remote may set only theme, layout, ui, diff, pane labels/icons

# ── Theme ────────────────────────────────────────────────────────────────
[theme]
name = "lazyhub-dark"    # lazyhub-dark | lazyhub-light | lazyhub-high-contrast | <user>-<repo>

[theme.overrides]        # optional partial token overrides, e.g. "accent.primary" = "#ff7eb6"

# ── Defaults ─────────────────────────────────────────────────────────────
[defaults]
pr_scope    = "mine"          # mine | reviewing | all
ai_provider = "claude-code"   # claude-code | codex | gemini-cli | anthropic-api | openai-compatible
repo        = ""              # owner/name saved by first-run onboarding; used only when no repo is detected from the current directory
repo_host   = ""              # host that repo belongs to; the saved repo is ignored under a different GH_HOST

# ── App registry and pane metadata ───────────────────────────────────────
[app]
active_panes      = ["focus", "prs", "issues", "branches", "actions", "notifications"]
default_pane      = "focus"
mouse             = false
ai_review_enabled = true

[panes.prs]
label       = "Pull Requests"
icon        = "⎇"
description = "Review and manage pull requests"

[panes.issues]
label       = "Issues"
icon        = "⚑"
description = "Triage repository issues"

[panes.branches]
label       = "Branches"
icon        = "⌥"
description = "Inspect and checkout branches"

[panes.actions]
label       = "Actions"
icon        = "↯"
description = "Inspect workflow runs"

[panes.notifications]
label       = "Notifications"
icon        = "✦"
description = "Review GitHub notifications"

# ── Feature defaults consumed by legacy call sites through config.js ─────
[features.prs]
default_filter = "open"
default_scope  = "mine"
page_size      = 100

[features.issues]
default_filter = "open"
page_size      = 50

[features.actions]
page_size = 30

[layout]
sidebar_width  = 24
sidebar        = true
preview_panel  = true
preview_width  = 40
border_style   = "round"
compact_footer = false

[diff]
default_view     = "unified"
syntax_highlight = true
max_lines        = 2000

[editor]
command        = "auto"
custom_command = ""

[ipc]
enabled = true
allow_writes = false   # true lets editor integrations reply to/resolve review threads over the IDE socket

# ── UI ───────────────────────────────────────────────────────────────────
[ui]
density       = "compact"   # compact | comfortable
show_hints    = true
no_color      = false       # also honored when $NO_COLOR is set and non-empty
icons         = "auto"      # auto | unicode | ascii (auto: ASCII on TERM=linux/dumb, non-UTF-8 locales, legacy Windows consoles)
high_contrast = false

# ── Keymaps ──────────────────────────────────────────────────────────────
[keymaps.global]
":"              = "command-palette.open"
"<space><space>" = "command-palette.open"
","              = "app.settings"
"q"              = "app.back"
"?"              = "app.help"
"Ctrl+D"         = "debug.dump-state"

[keymaps.pr-list]
"j"     = "cursor.down"
"k"     = "cursor.up"
"enter" = "pr.open-selected"
"a"     = "pr.approve"
"m"     = "pr.merge"
"r"     = "list.refresh"


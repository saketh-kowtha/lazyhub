name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote, without the leading v'
        required: true
        type: string
      confirm_version:
        description: 'Type the same version again to confirm promotion'
        required: true
        type: string

# npm auth is OIDC trusted publishing (no NPM_TOKEN). The trusted publisher for
# promote.yml must have the `npm dist-tag` permission enabled and be bound to
# the `npm-publish` environment. See docs/RELEASING.md.
permissions: {}

jobs:
  promote:
    name: Promote npm next to latest
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing (dist-tag)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # dist-tag over OIDC requires npm >= 11.21.0 (or >= 12.2.0).
      - name: Install npm with OIDC dist-tag support
        run: npm install -g npm@11.21.1

      - name: Confirm version input
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm_version }}
        run: |
          if [ "$VERSION" != "$CONFIRM" ]; then
            echo "::error::version and confirm_version must match"
            exit 1
          fi

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Record toolchain and lockfile identity
        run: node scripts/record-toolchain.mjs --verify-clean

      - name: Build promotion smoke artifact
        run: npm run build

      - name: Verify live gh smoke path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr list --repo saketh-kowtha/lazyhub --limit 1 --json number,title

      # A version that is already `latest` (promoted by hand, or by an earlier run that stopped before
      # the Homebrew step) is allowed: the dist-tag step is skipped and the tap is still brought up to date.
      # Before this, such a rerun failed here and the tap stayed on an old version (#472).
      - name: Verify package is on next, or already latest
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          NEXT="$(npm view lazyhub dist-tags.next)"
          LATEST="$(npm view lazyhub dist-tags.latest)"
          if [ "$LATEST" = "$VERSION" ]; then
            echo "already_latest=true" >> "$GITHUB_OUTPUT"
          elif [ "$NEXT" = "$VERSION" ]; then
            echo "already_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::lazyhub@$VERSION is neither the next tag (next=$NEXT) nor latest (latest=$LATEST)"
            exit 1
          fi

      # The tap bump used to be skipped with a warning when TAP_TOKEN was missing, so a promotion
      # could go green while Homebrew stayed on an old version (#472). Check it first and fail
      # before the dist-tag moves, so a promotion is never half done.
      - name: Require TAP_TOKEN
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not available to this job: the Homebrew tap cannot be updated. Add it to the repository or the npm-publish environment, then rerun."
            exit 1
          fi

      - name: Promote npm dist-tag
        if: steps.tag.outputs.already_latest != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: npm dist-tag add "lazyhub@${VERSION}" latest

      - name: Compute tarball SHA256 for Homebrew
        id: sha
        env:
          VERSION: ${{ inputs.version }}
        run: |
          URL="https://registry.npmjs.org/lazyhub/-/lazyhub-${VERSION}.tgz"

          echo "Waiting for tarball ${VERSION} on npm CDN..."
          for i in $(seq 1 18); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL")
            [ "$STATUS" = "200" ] && break
            echo "  attempt $i/18: HTTP $STATUS - retrying in 10s"
            sleep 10
          done

          SHA=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$URL" | sha256sum | awk '{print $1}')
          echo "sha=${SHA}"        >> "$GITHUB_OUTPUT"
          echo "url=${URL}"        >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Render Homebrew formula
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA256:  ${{ steps.sha.outputs.sha }}
          URL:     ${{ steps.sha.outputs.url }}
        run: node scripts/homebrew-formula.mjs render "$URL" "$SHA256" "$VERSION" > "$RUNNER_TEMP/lazyhub.rb"

      - name: Push Homebrew formula
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          FORMULA_FILE: ${{ runner.temp }}/lazyhub.rb
        with:
          github-token: ${{ secrets.TAP_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs')
            const { VERSION, FORMULA_FILE } = process.env
            const formula = readFileSync(FORMULA_FILE, 'utf8')
            const owner = 'saketh-kowtha', repo = 'homebrew-tap', path = 'Formula/lazyhub.rb'
            let sha
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path })
              sha = data.sha
            } catch (err) { if (err.status !== 404) throw err }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `lazyhub ${VERSION}`,
              content: Buffer.from(formula).toString('base64'),
              sha,
            })

      # Fails the promotion when the tap does not end up on the npm version.
      - name: Verify the tap matches npm
        run: node scripts/homebrew-formula.mjs check --wait 120

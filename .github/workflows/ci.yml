name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per PR / ref: a newer push cancels the stale PR run, but pushes to main
# always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Markdown-only PRs skip every other job. Skipped jobs count as passing for
  # required checks; `on.pull_request.paths-ignore` would instead leave them
  # unreported and the PR BLOCKED, so the gate lives here.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does the change touch anything besides Markdown?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            # Whole PR (merge-base to head), not just the last commit. A failed
            # diff or an empty file list leaves code=true.
            if files=$(git diff --name-only "$BASE...$HEAD") && [ -n "$files" ]; then
              echo "$files"
              if ! echo "$files" | grep -q -v -E '\.md$'; then code=false; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs exactly the committed package-lock.json; `npm ci` fails if it
      # disagrees with package.json. The lockfile carries every platform's
      # optional native bindings (docs/RELEASING.md, "Dependency graph").
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Record toolchain and lockfile identity
        run: node scripts/record-toolchain.mjs --verify-clean

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The coverage run executes the whole suite and enforces the floors in
      # vite.config.js, so a separate plain `npm test` would only repeat it.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Checkout base branch for coverage diff
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-coverage

      - name: Install base branch dependencies (locked)
        if: github.event_name == 'pull_request'
        working-directory: .base-coverage
        run: npm ci --no-audit --no-fund

      - name: Collect base branch coverage
        if: github.event_name == 'pull_request'
        working-directory: .base-coverage
        continue-on-error: true
        run: npx vitest run --coverage.enabled true --coverage.provider v8 --coverage.reporter=text --coverage.reporter=json-summary --coverage.reporter=json --coverage.reporter=html --coverage.reportsDirectory=coverage

      - name: Report coverage in PR
        if: always() && github.event_name == 'pull_request' && hashFiles('.base-coverage/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          json-summary-compare-path: .base-coverage/coverage/coverage-summary.json
          file-coverage-mode: changes-affected

      - name: Report coverage in PR (no base compare)
        if: always() && github.event_name == 'pull_request' && hashFiles('.base-coverage/coverage/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes-affected

  # The engines floor (package.json: node >=20): the unit suite on the oldest
  # supported Node. Node 22 is covered by the coverage run in `check`.
  test-node20:
    name: Test (Node 20)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Shipped (runtime) dependencies only; fails on a known high or critical
      # advisory. Required by main's branch protection.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # Two explicit jobs, not a matrix: a matrix job skipped by a job-level `if`
  # reports under the literal name `PTY E2E (${{ matrix.os }})`, so the required
  # checks `PTY E2E (ubuntu-latest)` / `(macos-latest)` would never report on a
  # Markdown-only PR.
  pty-ubuntu:
    name: PTY E2E (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Record toolchain and lockfile identity
        run: node scripts/record-toolchain.mjs --verify-clean

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Build
        run: npm run build

      - name: Packed install smoke (zero runtime dependencies)
        run: node scripts/packed-install-smoke.mjs

      - name: PTY E2E
        run: npm run test:pty

  pty-macos:
    name: PTY E2E (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Record toolchain and lockfile identity
        run: node scripts/record-toolchain.mjs --verify-clean

      - name: Build
        run: npm run build

      - name: Packed install smoke (zero runtime dependencies)
        run: node scripts/packed-install-smoke.mjs

      - name: PTY E2E
        run: npm run test:pty

  # TUI memory budget (#311): the Focus -> PRs -> detail -> diff journey inside a
  # hard 512 MB container. Fails if the container OOMs or lazyhub's peak RSS
  # exceeds LAZYHUB_RSS_BUDGET_MB (default lives in test/pty/memory.js). The second
  # run (LAZYHUB_SCALE=1) uses a 1,200-PR / 1,000-file-diff fixture: the PR list
  # must page past the first 100 rows and stay inside the same RSS budget. Both
  # journeys share one install, build and node-pty rebuild.
  memory-budget:
    name: TUI memory budget (512 MB)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile-free)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Rebuild node-pty for the container libc
        # The runner (ubuntu-26.04) compiles pty.node against a newer glibc than
        # node:22-bookworm has, so the host-built binary cannot load in the
        # container (#358). Rebuild it inside the same image, without the
        # memory cap (node-gyp needs more than 512 MB).
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:22-bookworm \
            npm rebuild node-pty

      - name: Journey under a 512 MB limit
        run: |
          docker run --rm -m 512m --memory-swap 512m \
            -v "$PWD:/app" -w /app node:22-bookworm \
            node test/pty/memory.js

      - name: Scale journey under a 512 MB limit
        run: |
          docker run --rm -m 512m --memory-swap 512m -e LAZYHUB_SCALE=1 \
            -v "$PWD:/app" -w /app node:22-bookworm \
            node test/pty/memory.js

  # Terminal portability (#311): ASCII-only, uncolored 80x24 journey on TERM=linux.
  portability-smoke:
    name: TERM=linux PTY smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: TERM=linux, LANG=C, NO_COLOR journey at 80x24
        run: npm run test:portability

  # musl libc (#311): build and packed-install smoke on Alpine / Node 20 (the
  # engines floor). node-pty is a dev-only native module, so scripts are skipped.
  alpine-smoke:
    name: Alpine (musl) smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build and packed-install smoke on node:20-alpine
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:20-alpine sh -c '
            set -e
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build
            node scripts/packed-install-smoke.mjs
            node dist/lazyhub.js --version'

  windows-smoke:
    name: Windows smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Record toolchain and lockfile identity
        run: node scripts/record-toolchain.mjs --verify-clean

      - name: Build
        run: npm run build

      - name: Packed install smoke (zero runtime dependencies)
        run: node scripts/packed-install-smoke.mjs

      - name: Verify CLI starts
        shell: pwsh
        run: |
          node dist/lazyhub.js --version
          node dist/lazyhub.js status --format json

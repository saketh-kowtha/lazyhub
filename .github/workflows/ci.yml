name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Workaround for npm's optional-deps bug
      # (https://github.com/npm/cli/issues/4828). Lockfiles generated on macOS
      # omit Linux-specific native bindings for rollup/rolldown, so `npm ci`
      # fails on ubuntu-latest. Even `npm install` respects the existing
      # lockfile and skips the missing platform bindings. Removing the lockfile
      # first forces a fresh resolution that includes the Linux bindings.
      # Trade-off: CI no longer enforces lockfile determinism. Acceptable for a
      # single-maintainer OSS project until npm 11+ ships the upstream fix.
      - name: Install dependencies (lockfile-free)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Checkout base branch for coverage diff
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-coverage

      - name: Install base branch dependencies (lockfile-free)
        if: github.event_name == 'pull_request'
        working-directory: .base-coverage
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Collect base branch coverage
        if: github.event_name == 'pull_request'
        working-directory: .base-coverage
        run: npm run test:coverage

      - name: Report coverage in PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          json-summary-compare-path: .base-coverage/coverage/coverage-summary.json
          file-coverage-mode: changes-affected
